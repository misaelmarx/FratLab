name: Verificar FretLab

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Também publicar no GitHub Pages (precisa estar ativado em Settings → Pages)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Verificar aplicativo
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verificar JavaScript e identificação musical
        run: |
          node --check dist/app.js
          node --check dist/music.js
          node tests/music.cjs
          node tests/ui.cjs

  deploy:
    name: Publicar no GitHub Pages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pages }}
    needs: checks
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar site estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
